# Console, shell and logging on the MCU-Link virtual COM port.
# Log output is routed through the shell backend.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_DEFAULT_LEVEL=3

# Diagnostics
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# Board I/O
CONFIG_GPIO=y

# SX1255 configuration interface. Register transfers are a few bytes long,
# so the CPU-driven LPSPI driver is used and no DMA channels are occupied.
CONFIG_SPI=y
CONFIG_SPI_NXP_LPSPI_DMA=n

# Floating point for signal diagnostics (thread context only)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Software reset, used to apply a new configuration
CONFIG_REBOOT=y

# Hardware watchdog (WWDT0)
CONFIG_WATCHDOG=y

# Networking: IPv4 only, TCP control channel, UDP samples
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=12
# Connection handlers: DHCP, mDNS, UDP samples, TCP listener, TCP session,
# web interface (listener and clients)
CONFIG_NET_MAX_CONN=12
CONFIG_ZVFS_OPEN_MAX=16

# Host name and mDNS responder: phenix-1255.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="phenix-1255"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_RESOLVER=y

# Network buffers for 1472-byte sample packets in both directions.
# The ENET-QOS driver uses one net_buf of NET_BUF_DATA_SIZE per RX
# descriptor; with 1536 bytes every frame fits into one descriptor, so the
# 32 descriptors absorb a burst of 32 frames (about 4 ms at 100 Mbit/s).
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS=32
CONFIG_ETH_NXP_ENET_QOS_TX_BUFFER_DESCRIPTORS=16
CONFIG_ETH_NXP_ENET_QOS_RX_THREAD_PRIORITY=1
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=24

# The network RX thread is preemptive and below the RX pump: a burst of
# incoming TX sample packets would otherwise keep the cooperative thread
# busy for longer than the RX ring holds (5.6 ms at 600 kS/s).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=5

# Diagnostics on the console (net iface, net ping, ...)
CONFIG_NET_SHELL=y

# Front panel: SSD1306 OLED on LPI2C3, rotary encoder and buttons.
# Input callbacks run in the reporting driver's context, which saves the
# input thread and its stack.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# HS USB device (USB1, EHCI controller), vendor specific function
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_THREAD_STACK_SIZE=1536

# CPU-only buffers in SRAMX, see CMakeLists.txt
CONFIG_CODE_DATA_RELOCATION=y

# Unique ID for the device serial number
CONFIG_HWINFO=y

# Persistent configuration in the internal flash settings partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
